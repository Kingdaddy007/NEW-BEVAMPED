<section class="instrument" id="direct-the-space" aria-labelledby="instrument-title">
  <header class="instrument-heading"><div><small>Interactive study</small><h2 id="instrument-title">Direct the space.</h2></div><p>Choose a room. Move the framing slider to decide what comes into view first.</p></header>
  <div class="study-picks" role="group" aria-label="Room study">
    <button type="button" aria-pressed="true" data-room="restraint">Shadow wall</button>
    <button type="button" aria-pressed="false" data-room="scale">Garden room</button>
    <button type="button" aria-pressed="false" data-room="sequence">Enfilade</button>
  </div>
  <div class="composition" data-layout="cover">
    <div class="photo-bay"><div class="camera"><img src="/more-than-a-gallery/principles/restraint-1600.webp" alt="Low sofa beside a wall cut by diagonal sunlight" loading="lazy"></div><div class="grade"></div></div>
    <div class="plate-type"><small>Room study</small><strong>Shadow wall</strong></div>
  </div>
  <div class="console">
    <label for="framing">Framing <span><i>Wide</i><i>Detail</i></span><input id="framing" type="range" value="0" min="0" max="100"></label>
    <fieldset><legend>Composition</legend><div><button type="button" data-layout="cover" aria-pressed="true">Cover</button><button type="button" data-layout="spread" aria-pressed="false">Spread</button></div></fieldset>
    <label for="atmosphere">Atmosphere <span><i>Daylight</i><i>Dusk</i></span><input id="atmosphere" type="range" value="0" min="0" max="100"></label>
  </div>
  <p class="observation" aria-live="polite" aria-atomic="true">The wide frame lets you follow the diagonal light from the floor to the wall.</p>
</section>
